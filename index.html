<title>Church Slavonic Synodal Translator</title>
<style>
:root{--bg:#111018;--panel:#1d1a26;--panel2:#252130;--gold:#d7b878;--gold2:#f0d9a5;--ink:#f4efe5;--muted:#aaa3b4;--line:#40394b;--green:#9bc5a6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#393044 0%,#17141e 48%,#100f16 100%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}

main{width:min(1050px,calc(100% - 32px));margin:30px auto 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}

button,select{font:14px Arial,sans-serif;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--panel2);color:var(--ink);cursor:pointer}
button:hover,select:hover{border-color:var(--gold);color:var(--gold2)}
.lang.active{background:#493b32;border-color:var(--gold);color:var(--gold2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:linear-gradient(145deg,#211e2a,#191722);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 14px 38px #0003}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line);font:12px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.panel-head select{width:auto;max-width:190px;padding:8px 10px;font-size:12px;letter-spacing:0;text-transform:none;flex-shrink:0}
.panel-head .target-title{min-width:0;flex:1;overflow-wrap:anywhere}
textarea{width:100%;min-height:280px;resize:vertical;background:transparent;border:0;outline:0;padding:20px;color:var(--ink);font:19px/1.65 Georgia,"Times New Roman",serif}
textarea::placeholder{color:#827b8b}
.output{min-height:280px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;font:21px/1.7 Georgia,"Times New Roman",serif;color:#f3e6c8}
.empty{color:#827b8b}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.primary{background:linear-gradient(135deg,#b99a60,#80643d);color:#17131a;border:0;font-weight:bold}
.primary:hover{color:#100e14;border:0;filter:brightness(1.08)}
.stats{display:flex;gap:18px;flex-wrap:wrap;padding:13px 17px;border-top:1px solid var(--line);font:12px Arial,sans-serif;color:var(--muted)}
.stats strong{color:var(--gold2);font-weight:normal}
.note{color:var(--muted);font:13px/1.6 Arial,sans-serif;margin:16px 2px 0}
.dictionary{margin-top:26px;background:#191722;border:1px solid var(--line);border-radius:14px;padding:18px}
.dictionary h2{font-size:19px;font-weight:normal;color:var(--gold2);margin:0 0 12px}
.dictionary p{font:13px/1.6 Arial,sans-serif;color:var(--muted);margin:0}
footer{text-align:center;color:#746d7d;font:11px Arial,sans-serif;letter-spacing:1px;padding:0 15px 28px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.panel textarea,.output{min-height:190px}header{padding-top:26px}}
</style>
</head>

  // Plural forms use the correct spelling for the selected output language.
  // Russian output must be Russian; Ukrainian and Belarusian keep "Лукаві".
  const pluralEnemyTarget = {uk:'Лукаві', ru:'Лукавые', be:'Лукаві'}[targetLanguage] || 'Лукаві';
  const pluralEnemyInputPattern = /(^|[^\p{L}\p{M}])(вороги|враги|ворагі|ворогі)(?=$|[^\p{L}\p{M}])/giu;
  output = output.replace(pluralEnemyInputPattern, (whole, left, matched) => {
    count++;
    knownWords.add(matched.toLocaleLowerCase());
    return left + matchCase(matched, pluralEnemyTarget);
  });

  // First apply the site's own Church Slavonic dictionary. Its rules always
  // take priority over the online fallback.
  const selectedMap=sourceLanguageMap.map((entry,index)=>{
    const targetEntry=targetLanguageMap[index];
    return [entry[0], targetEntry ? targetEntry[1] : entry[1]];
  });
  const sorted=[...pluralMap,...selectedMap].sort((a,b)=>b[0].length-a[0].length);
  for(const [from,to] of sorted){
    const re=new RegExp('(^|[^\p{L}\p{M}])('+escapeReg(from)+')(?=$|[^\p{L}\p{M}])','giu');
    output=output.replace(re,(whole,left,word)=>{count++;knownWords.add(word.toLocaleLowerCase());return left+matchCase(word,to)});
  }

  // Translate only words that the local dictionary does not know.
  // This keeps the existing Church Slavonic translations unchanged.
  const unknownWords=[...new Set((text.match(/[\p{L}\p{M}]+/gu)||[])
    .filter(word=>!knownWords.has(word.toLocaleLowerCase()))
    .filter(word=>ui!==targetLanguage))];

  if(unknownWords.length){
    const langCodes={uk:'uk',ru:'ru',be:'be'};
    const translated=new Map();
    await Promise.all(unknownWords.map(async word=>{
      try{
        const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+
          encodeURIComponent(langCodes[ui]||'uk')+'&tl='+
          encodeURIComponent(langCodes[targetLanguage]||'uk')+'&dt=t&q='+encodeURIComponent(word);
        let value='';
        try{
          const response=await fetch(url);
          if(response.ok){
            const data=await response.json();
            value=Array.isArray(data?.[0]) ? data[0].map(part=>part?.[0]||'').join('') : '';
          }
        }catch(error){}
        // Backup service: use it when Google's public web endpoint is blocked.
        if(!value){
          try{
            const pair=(langCodes[ui]||'uk')+'|'+(langCodes[targetLanguage]||'ru');
            const backup='https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair='+encodeURIComponent(pair);
            const backupResponse=await fetch(backup);
            if(backupResponse.ok){
              const backupData=await backupResponse.json();
              value=backupData?.responseData?.translatedText||'';
              if(value && /MYMEMORY WARNING|PLEASE SELECT/i.test(value)) value='';
            }
          }catch(error){}
        }
        if(value) translated.set(word.toLocaleLowerCase(),value);
      }catch(error){
        // If both online services are unavailable, keep the original word.
      }
    }));
    if(run!==translationRun) return;
    for(const [word,value] of translated){
      const re=new RegExp('(^|[^\p{L}\p{M}])('+escapeReg(word)+')(?=$|[^\p{L}\p{M}])','giu');
      output=output.replace(re,(whole,left,matched)=>{count++;return left+matchCase(matched,value)});
    }
  }

  if(run!==translationRun) return;

  // Final normalization guarantees the plural form matches the selected
  // output language, including results returned by the online fallback.
  const finalPluralEnemyTarget = {uk:'Лукаві', ru:'Лукавые', be:'Лукаві'}[targetLanguage] || 'Лукаві';
  const pluralEnemyPattern = /(^|[^\p{L}\p{M}])(лукавийї|лукавыйї|лукавые|лукавіе|лукавие|лукаві|лукавыя)(?=$|[^\p{L}\p{M}])/giu;
  output = output.replace(pluralEnemyPattern, (whole, left) => left + finalPluralEnemyTarget);

  result.textContent=output||labels[ui].empty;
  result.classList.toggle('empty',!output);
  document.getElementById('inputCount').innerHTML=labels[ui].chars+' <strong>'+[...text].length+'</strong>';
  document.getElementById('wordCount').innerHTML=labels[ui].replaced+' <strong>'+count+'</strong>';
  document.getElementById('unknownCount').innerHTML=labels[ui].unknown+' <strong>—</strong>';
}
function setLang(lang){
 ui=lang;document.documentElement.lang=lang;
 document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 const l=labels[lang];document.getElementById('sourceLabel').textContent=l.source;document.getElementById('targetLabel').textContent=l.synodal;
 source.placeholder=l.placeholder;document.getElementById('translate').textContent=l.translate;document.getElementById('copy').textContent=l.copy;document.getElementById('clear').textContent=l.clear;
 document.querySelector('.dictionary h2').textContent=l.dictionary;
  const connectionNote=document.getElementById('translationConnectionNote');
  if(connectionNote) connectionNote.textContent=({
})[lang];
  document.querySelector('footer').textContent=l.footer;
 const opts=synodalLanguage.options;opts[0].textContent=l.sourceOption;opts[1].textContent=l.ruOption;opts[2].textContent=l.beOption;
 if(!source.value) result.textContent=l.empty;translate();
}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.getElementById('translate').addEventListener('click',translate);
synodalLanguage.addEventListener('change',translate);
source.addEventListener('input',translate);
document.getElementById('clear').addEventListener('click',()=>{source.value='';translate();source.focus()});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(result.textContent);const b=document.getElementById('copy'),old=b.textContent;b.textContent=labels[ui].copied;setTimeout(()=>b.textContent=old,1500)}catch(e){const r=document.createRange();r.selectNodeContents(result);getSelection().removeAllRanges();getSelection().addRange(r)}});
translate();
</script>
